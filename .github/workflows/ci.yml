name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trueface_test
          POSTGRES_USER: trueface
          POSTGRES_PASSWORD: trueface
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trueface -d trueface_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trueface:trueface@localhost:5432/trueface_test?schema=public
      DIRECT_DATABASE_URL: postgresql://trueface:trueface@localhost:5432/trueface_test?schema=public
      AUTH_SECRET: ci-auth-secret-that-is-at-least-32-characters
      SETTINGS_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
